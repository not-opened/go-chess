let activeFilter = 'all';
let filteredList = miniPuzzles;
let currentIdx = 0;
let solvedState = null; // null | { r, c, isCorrect }
let soundEnabled = true;
let audioCtx = null;

function playTone(type) {
  if (!soundEnabled || typeof window === 'undefined') return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type === 'ok' ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(type === 'ok' ? 660 : 210, now);
    if (type === 'ok') osc.frequency.setValueAtTime(880, now + 0.08);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  } catch (e) { /* ignore */ }
}

function getCurrentPuzzle() {
  return filteredList[currentIdx % filteredList.length];
}

function renderTabs() {
  const wrap = document.getElementById('puzzleTabs');
  if (!wrap) return;
  wrap.innerHTML = '';
  filteredList.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `puzzle-tab${idx === currentIdx ? ' active' : ''}`;
    btn.textContent = `#${idx + 1} ${p.type === 'go' ? '바둑' : '체스'}`;
    btn.setAttribute('data-idx', String(idx));
    btn.onclick = () => selectPuzzle(idx);
    wrap.appendChild(btn);
  });
}

function renderGoBoard(puzzle) {
  const size = puzzle.size;
  const pad = 26;
  const cell = 38;
  const vb = pad * 2 + cell * (size - 1);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${vb} ${vb}`);
  svg.setAttribute('class', 'board-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', '9x9 바둑판');

  const bg = document.createElementNS(svgNS, 'rect');
  bg.setAttribute('width', vb);
  bg.setAttribute('height', vb);
  bg.setAttribute('rx', '10');
  bg.setAttribute('fill', '#dcb35c');
  svg.appendChild(bg);

  for (let i = 0; i < size; i++) {
    const pos = pad + i * cell;
    const h = document.createElementNS(svgNS, 'line');
    h.setAttribute('x1', pad);
    h.setAttribute('y1', pos);
    h.setAttribute('x2', vb - pad);
    h.setAttribute('y2', pos);
    h.setAttribute('stroke', '#3b2f1c');
    h.setAttribute('stroke-width', '1.3');
    svg.appendChild(h);

    const v = document.createElementNS(svgNS, 'line');
    v.setAttribute('x1', pos);
    v.setAttribute('y1', pad);
    v.setAttribute('x2', pos);
    v.setAttribute('y2', vb - pad);
    v.setAttribute('stroke', '#3b2f1c');
    v.setAttribute('stroke-width', '1.3');
    svg.appendChild(v);
  }

  // Star points for 9x9
  [[2, 2], [2, 6], [4, 4], [6, 2], [6, 6]].forEach(([sr, sc]) => {
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', pad + sc * cell);
    dot.setAttribute('cy', pad + sr * cell);
    dot.setAttribute('r', '3.2');
    dot.setAttribute('fill', '#3b2f1c');
    svg.appendChild(dot);
  });

  const occupied = new Map();
  puzzle.stones.forEach(s => occupied.set(`${s.r},${s.c}`, s.color));

  // Render placed move if answered
  if (solvedState) {
    occupied.set(`${solvedState.r},${solvedState.c}`, puzzle.playerColor);
  }

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cx = pad + c * cell;
      const cy = pad + r * cell;
      const stoneColor = occupied.get(`${r},${c}`);
      if (stoneColor) {
        const st = document.createElementNS(svgNS, 'circle');
        st.setAttribute('cx', cx);
        st.setAttribute('cy', cy);
        st.setAttribute('r', '15');
        st.setAttribute('fill', stoneColor === 'B' ? '#111827' : '#f8fafc');
        st.setAttribute('stroke', stoneColor === 'B' ? '#000000' : '#64748b');
        st.setAttribute('stroke-width', '1.5');
        svg.appendChild(st);

        if (solvedState && solvedState.r === r && solvedState.c === c) {
          const ring = document.createElementNS(svgNS, 'circle');
          ring.setAttribute('cx', cx);
          ring.setAttribute('cy', cy);
          ring.setAttribute('r', '7');
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', solvedState.isCorrect ? '#22c55e' : '#ef4444');
          ring.setAttribute('stroke-width', '2.8');
          svg.appendChild(ring);
        }
      } else {
        const hit = document.createElementNS(svgNS, 'circle');
        hit.setAttribute('cx', cx);
        hit.setAttribute('cy', cy);
        hit.setAttribute('r', '16');
        hit.setAttribute('fill', 'transparent');
        hit.setAttribute('class', 'board-hit');
        hit.setAttribute('data-row', String(r));
        hit.setAttribute('data-col', String(c));
        hit.setAttribute('role', 'button');
        hit.setAttribute('aria-label', `${r + 1}행 ${c + 1}열 착수`);
        hit.onclick = () => handleMove(r, c);
        svg.appendChild(hit);
      }
    }
  }
  return svg;
}

function renderChessBoard(puzzle) {
  const size = puzzle.size;
  const cell = 44;
  const vb = cell * size;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${vb} ${vb}`);
  svg.setAttribute('class', 'board-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', '8x8 체스판');

  const pieceMap = new Map();
  puzzle.pieces.forEach(p => {
    if (solvedState && p.mover) return; // move piece to destination
    pieceMap.set(`${p.r},${p.c}`, p);
  });
  if (solvedState) {
    pieceMap.set(`${solvedState.r},${solvedState.c}`, {
      r: solvedState.r,
      c: solvedState.c,
      symbol: puzzle.moverSymbol,
      side: 'W'
    });
  }

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const isLight = (r + c) % 2 === 0;
      const sq = document.createElementNS(svgNS, 'rect');
      sq.setAttribute('x', c * cell);
      sq.setAttribute('y', r * cell);
      sq.setAttribute('width', cell);
      sq.setAttribute('height', cell);

      let fill = isLight ? '#e2e8f0' : '#475569';
      if (solvedState && solvedState.r === r && solvedState.c === c) {
        fill = solvedState.isCorrect ? '#86efac' : '#fca5a5';
      }
      sq.setAttribute('fill', fill);
      sq.setAttribute('class', solvedState ? '' : 'board-hit');
      sq.setAttribute('data-row', String(r));
      sq.setAttribute('data-col', String(c));
      sq.setAttribute('role', 'button');
      sq.setAttribute('aria-label', `${String.fromCharCode(97 + c)}${8 - r} 칸 선택`);
      sq.onclick = () => handleMove(r, c);
      svg.appendChild(sq);

      const p = pieceMap.get(`${r},${c}`);
      if (p) {
        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', c * cell + cell / 2);
        txt.setAttribute('y', r * cell + cell * 0.72);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '30');
        txt.setAttribute('pointer-events', 'none');
        txt.setAttribute('fill', p.side === 'W' ? '#0f172a' : '#020617');
        txt.textContent = p.symbol;
        svg.appendChild(txt);
      }
    }
  }
  return svg;
}

function handleMove(r, c) {
  if (solvedState) return;
  const puzzle = getCurrentPuzzle();
  const isCorrect = (r === puzzle.answer.r && c === puzzle.answer.c);
  solvedState = { r, c, isCorrect };
  playTone(isCorrect ? 'ok' : 'ng');
  renderBoardOnly();
  renderFeedback(puzzle, isCorrect);
}

function renderFeedback(puzzle, isCorrect) {
  const box = document.getElementById('feedbackBox');
  const status = document.getElementById('feedbackStatus');
  const text = document.getElementById('feedbackText');
  const source = document.getElementById('feedbackSource');
  if (!box) return;
  box.className = `feedback-box show ${isCorrect ? 'ok' : 'ng'}`;
  if (status) {
    status.textContent = isCorrect ? '✅ 정답입니다! 완벽한 한 수예요.' : '❌ 아쉽습니다! 다시 도전하거나 해설을 확인해 보세요.';
    status.style.color = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  }
  if (text) text.textContent = puzzle.explanation;
  if (source) source.textContent = `출처: ${puzzle.source}`;
}

function renderBoardOnly() {
  const puzzle = getCurrentPuzzle();
  const wrap = document.getElementById('boardWrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  wrap.appendChild(puzzle.type === 'go' ? renderGoBoard(puzzle) : renderChessBoard(puzzle));
}

function renderPuzzle() {
  solvedState = null;
  const puzzle = getCurrentPuzzle();
  const typePill = document.getElementById('puzzleTypePill');
  const counter = document.getElementById('puzzleCounter');
  const title = document.getElementById('puzzleTitle');
  const prompt = document.getElementById('puzzlePrompt');
  const fb = document.getElementById('feedbackBox');

  if (typePill) typePill.textContent = puzzle.typeLabel;
  if (counter) counter.textContent = `${currentIdx + 1} / ${filteredList.length}`;
  if (title) title.textContent = puzzle.title;
  if (prompt) prompt.textContent = puzzle.prompt;
  if (fb) fb.className = 'feedback-box';

  renderTabs();
  renderBoardOnly();
}

function retryPuzzle() {
  renderPuzzle();
}

function nextPuzzle() {
  currentIdx = (currentIdx + 1) % filteredList.length;
  renderPuzzle();
}

function selectPuzzle(idx) {
  currentIdx = idx;
  renderPuzzle();
}

function setFilter(typeKey) {
  activeFilter = typeKey;
  filteredList = typeKey === 'all' ? miniPuzzles : miniPuzzles.filter(p => p.type === typeKey);
  currentIdx = 0;
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-type') === typeKey);
  });
  renderPuzzle();
}

function init() {
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.getAttribute('data-type')));
  });
  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.addEventListener('click', retryPuzzle);
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.addEventListener('click', nextPuzzle);
  const soundBtn = document.getElementById('soundToggleBtn');
  if (soundBtn) {
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });
  }
  renderPuzzle();
}

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', init);
  window.setFilter = setFilter;
  window.selectPuzzle = selectPuzzle;
  window.retryPuzzle = retryPuzzle;
  window.nextPuzzle = nextPuzzle;
}

</script>
</body>
</html>
